# dtlk reverse proxy, for the separate nginx server.
#
# 1. Copy to e.g. /etc/nginx/conf.d/dtlk.ga111o.com.conf (or sites-available + symlink).
# 2. Replace <DTLK_SERVER_IP> with the dtlk server's IP (port = GitHub variable DTLK_PORT, default 8780).
# 3. Check the certificate paths below, then: sudo nginx -t && sudo systemctl reload nginx
# 4. On the dtlk server, set the GitHub variable DTLK_TRUSTED_PROXY_IPS to THIS server's IP
#    and allow port 8780 only from this server in the firewall.

upstream dtlk_backend {
    server <DTLK_SERVER_IP>:8780;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dtlk.ga111o.com;

    # certbot --webroot challenge directory; not needed if you use "certbot --nginx"
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on; # nginx >= 1.25.1; on older nginx remove this line and use "listen 443 ssl http2;"
    server_name dtlk.ga111o.com;

    ssl_certificate     /etc/letsencrypt/live/dtlk.ga111o.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dtlk.ga111o.com/privkey.pem;
    # certbot's recommended TLS settings (remove these two lines if the files don't exist)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # dtlk uploads in 16 MiB parts
    client_max_body_size 20m;

    # stream uploads/downloads (up to 10 GB) instead of buffering them on disk
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    location / {
        proxy_pass http://dtlk_backend;
        proxy_set_header Host $host;
        # overwrite instead of append, so clients cannot spoof their IP (rate limits use it)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
